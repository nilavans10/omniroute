# Render Blueprint Specification for OmniRoute
# Reference: https://render.com/docs/blueprints

services:
  - type: web
    name: omniroute
    env: docker
    # Use the existing Dockerfile to build and run the service
    dockerContext: .
    dockerfilePath: Dockerfile

    # Deploy on the free plan (512MB RAM).
    # NOTE: Free plan has no persistent disk support.
    # Any SQLite database state (configurations, custom routes) will be lost on container restarts.
    plan: free

    envVars:
      - key: PORT
        value: 20128
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: OMNIROUTE_MEMORY_MB
        value: 512 # Match memory to Render free plan (512 MB)

