# Render Blueprint Specification for OmniRoute
# Reference: https://render.com/docs/blueprints

services:
  - type: web
    name: omniroute
    env: docker
    # Use the existing Dockerfile to build and run the service
    dockerContext: .
    dockerfilePath: Dockerfile

    # OmniRoute requires a plan with at least 1GB of RAM for standard operation
    # (e.g. Starter or higher) due to Next.js production memory overhead.
    plan: starter

    envVars:
      - key: PORT
        value: 20128
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: OMNIROUTE_MEMORY_MB
        value: 1024 # Match memory to Render starter plan (1 GB)

    # Attach a persistent disk to preserve SQLite database state across restarts
    disk:
      name: omniroute-data
      mountPath: /app/data
      sizeGB: 10
